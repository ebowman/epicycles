<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Epicycles</title>
    <style>
      html,body{margin:0;height:100%;background:#0b0d14;color:#ccd;font:13px/1.35 system-ui,sans-serif;overflow:hidden}
      #gl{position:fixed;inset:0;display:block;z-index:0}
      #ui{position:relative;z-index:2;display:flex;flex-direction:column;height:100%;pointer-events:none}
      #panel{pointer-events:auto;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;padding:8px 12px;background:#121626ee;border-bottom:1px solid #263}
      #panel label{display:flex;align-items:center;gap:6px;white-space:nowrap}
      #panel input[type=range]{width:150px}
      #panel #scrub{width:260px}
      #panel button{padding:3px 12px}
      #readout{font-variant-numeric:tabular-nums;color:#ffe08a}
      #views{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr}
      .view{position:relative;min-width:0;min-height:0;pointer-events:auto;overflow:hidden;border-right:1px solid #263}
      .view h2{position:absolute;margin:6px 10px;font-size:14px;font-weight:600;color:#9ab;pointer-events:none}
      .lbl{position:absolute;left:0;top:0;pointer-events:none;color:#cde;font-size:12px;text-shadow:0 0 3px #000}
      #nogl{display:none;position:fixed;inset:0;z-index:5;background:#0b0d14;align-items:center;justify-content:center;text-align:center;padding:2em}
      @media (max-width:800px){#views{grid-template-columns:1fr;grid-template-rows:1fr 1fr}.view{border-right:0;border-bottom:1px solid #263}#panel #scrub{width:200px}}
    </style>
  </head>
  <body>
    <canvas id="gl"></canvas>
    <div id="ui">
      <div id="panel">
        <button id="play">Pause</button>
        <label>Speed <input id="speed" type="range" min="0" max="1" step="0.001" value="0.65" /> <span id="speedv"></span></label>
        <label>Time <input id="scrub" type="range" min="-7305" max="7305" step="0.5" value="0" /> <span id="date"></span></label>
        <label>N <input id="nsl" type="range" min="1" max="60" step="1" value="20" /> <span id="nv"></span></label>
        <span id="readout"></span>
      </div>
      <div id="views">
        <div class="view" id="vL"><h2>Heliocentric (Newton/Kepler)</h2></div>
        <div class="view" id="vR"><h2>Geocentric (epicycles)</h2></div>
      </div>
    </div>
    <div id="nogl"><div><h2>WebGL is not available</h2><p>This visualisation needs WebGL. Try a current browser with hardware acceleration enabled.</p></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
